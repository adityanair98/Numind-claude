name: Numind
options:
  bundleIdPrefix: com.numind
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  Numind:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: Numind/App/Info.plist
      properties:
        CFBundleDisplayName: Numind
        CFBundleIdentifier: com.numind.app
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    sources:
      - path: Numind
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numind.app
        INFOPLIST_FILE: Numind/App/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

  NumindTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NumindTests
    dependencies:
      - target: Numind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.numind.app.tests
        GENERATE_INFOPLIST_FILE: YES
